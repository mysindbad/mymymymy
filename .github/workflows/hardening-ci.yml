name: Hardening CI

on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply deployment truth patch
        run: python3 scripts/apply-deployment-truth.py
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Persist tested deployment truth marker
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- server.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "test: expose deployed revision in health endpoint"
          git push origin HEAD:audit/deployment-truth-20260913
