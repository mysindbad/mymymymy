name: Hardening CI

on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply Vercel runtime contract fix
        run: python3 scripts/apply-vercel-runtime-fix.py
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Persist tested Vercel runtime fix
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- api/index.ts server.ts api/navigation.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.ts server.ts api/navigation.ts
          git commit -m "fix: align Vercel runtime with hardened database contracts"
          git push origin HEAD:audit/vercel-runtime-fix-20260913
