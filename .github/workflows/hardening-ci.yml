name: Hardening CI

on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply final hardening patch
        run: python3 scripts/apply-final-hardening.py
      - name: Show generated syntax context
        run: nl -ba server.ts | sed -n '680,700p'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Persist tested application hardening
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- server.ts server/dal.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts server/dal.ts
          git commit -m "security: harden application runtime and truth semantics"
          git push origin HEAD:audit/final-hardening-20260913
