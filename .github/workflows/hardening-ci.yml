name: Hardening CI

on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Verify truthful DAL fallback behavior
        run: node --import tsx scripts/verify-truthful-dal.ts
      - name: Verify user-facing truth contracts
        run: node --import tsx scripts/verify-user-truth-contracts.ts
      - run: npm run build
      - name: Verify Supabase URL bootstrap normalization
        run: |
          SUPABASE_URL=' "https://example.supabase.co/rest/v1?source=bad#fragment" ' node --import tsx --input-type=module -e "await import('./api/runtime.ts'); if (process.env.SUPABASE_URL !== 'https://example.supabase.co') { console.error('SUPABASE_URL was not normalized:', process.env.SUPABASE_URL); process.exit(1); }"
          VITE_SUPABASE_URL="'https://example.supabase.co/rest/v1'" node --import tsx --input-type=module -e "await import('./api/runtime.ts'); if (process.env.VITE_SUPABASE_URL !== 'https://example.supabase.co') { console.error('VITE_SUPABASE_URL was not normalized:', process.env.VITE_SUPABASE_URL); process.exit(1); }"
