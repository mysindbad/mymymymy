name: E2E

on:
  push:
    branches:
      - 'audit/**'
      # Work that stacks on an accepted-but-unmerged branch (the Admin Control Center PR targets
      # the product branch, not main) must still be verified, or a delivery can land with no checks
      # at all. The two patterns below only widen which refs are verified; nothing in the job relaxes.
      - 'arena/**'
  pull_request:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright core flows
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
