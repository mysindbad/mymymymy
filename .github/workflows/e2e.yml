name: E2E

on:
  push:
    branches:
      - 'audit/**'
      # Work that stacks on an accepted-but-unmerged branch (the Admin Control Center PR targets
      # the product branch, not main) must still be verified, or a delivery can land with no checks
      # at all. The two patterns below only widen which refs are verified; nothing in the job relaxes.
      - 'arena/**'
  pull_request:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read
  # Temporary, diagnostics only: lets the failure-digest step comment on the PR so the failure can
  # be read from a sandbox that cannot reach Actions' log storage. Removed with the step itself.
  issues: write
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright core flows
        id: playwright
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright.log
      - name: Post the failure digest where it can be read
        if: always() && steps.playwright.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          case "$GITHUB_REF" in
            refs/pull/*) pr="${GITHUB_REF#refs/pull/}"; pr="${pr%/merge}" ;;
            *) pr=$(gh pr list --head "${GITHUB_REF#refs/heads/}" --state open --json number --jq '.[0].number' || true) ;;
          esac
          [ -z "$pr" ] && { echo "no PR to comment on"; exit 0; }
          body=$(printf 'E2E failure digest for `%s`\n\n**grep:**\n```\n%s\n```\n\n**tail:**\n```\n%s\n```' "$GITHUB_SHA" \
            "$(grep -aE '✘|✗|[0-9]+\) |Error:|Expected|Received|Timed out|expect\(|strict mode violation|Received string' playwright.log | head -60 | cut -c1-280)" \
            "$(tail -40 playwright.log | cut -c1-280)")
          gh pr comment "$pr" --body "$body" || echo "comment failed"
          exit 0
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
