name: Extract project ZIP

on:
  push:
    branches:
      - realize/truth-sweep

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file="my-sindbad---ai-travel-discovery-&-navigation (1).zip"
          mkdir -p extracted
          unzip -o "$zip_file" -d extracted
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "phase0: extract project ZIP"
          git push origin HEAD:realize/truth-sweep
