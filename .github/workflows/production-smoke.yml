name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://mymymymy-dusky.vercel.app
    steps:
      - name: Wait for final Vercel runtime marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            trace_status=$(curl -sS -o /tmp/traces.json -w '%{http_code}' "$BASE_URL/api/traces/summary" || true)
            transit_status=$(curl -sS -o /tmp/transit.json -w '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{"destinationId":"00000000-0000-0000-0000-000000000000","startLatitude":35.7595,"startLongitude":-5.8340,"travelMode":"transit","language":"en"}' \
              "$BASE_URL/api/ai/navigation-guidance" || true)
            if [ "$trace_status" = "401" ] && [ "$transit_status" = "501" ] && python - <<'PY'
          import json
          try:
              trace=json.load(open('/tmp/traces.json'))
              transit=json.load(open('/tmp/transit.json'))
              assert trace.get('code') in {'TOKEN_MISSING','TOKEN_INVALID'}
              assert transit.get('code') == 'TRANSIT_NOT_SUPPORTED'
          except Exception:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo 'Final Vercel runtime deployment did not become ready in time' >&2
          exit 1

      - name: Homepage and health respond
        shell: bash
        run: |
          test "$(curl -sS -o /tmp/home.html -w '%{http_code}' "$BASE_URL/")" = "200"
          grep -qi '<html' /tmp/home.html
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health")" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('status') == 'ok'
          PY

      - name: Anonymous AI chat is blocked
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/ai.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"message":"hello","language":"en"}' \
            "$BASE_URL/api/ai/chat")
          test "$status" = "401"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/ai.json'))
          assert data.get('code') in {'TOKEN_MISSING','TOKEN_INVALID'}
          PY

      - name: Anonymous AI trip planning is blocked
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/plan.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{}' \
            "$BASE_URL/api/ai/plan-trip")
          test "$status" = "401"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/plan.json'))
          assert data.get('code') in {'TOKEN_MISSING','TOKEN_INVALID'}
          PY

      - name: Raw GPS summary requires authentication
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/traces.json -w '%{http_code}' "$BASE_URL/api/traces/summary")
          test "$status" = "401"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/traces.json'))
          assert data.get('code') in {'TOKEN_MISSING','TOKEN_INVALID'}
          text=json.dumps(data).lower()
          for forbidden in ('coordinates','anonymous_user_id','speed_kmh','near_place_id'):
              assert forbidden not in text
          PY

      - name: Anonymous check-in is blocked before database mutation
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/checkin.json -w '%{http_code}' \
            -X POST \
            "$BASE_URL/api/places/00000000-0000-0000-0000-000000000000/checkin")
          test "$status" = "401"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/checkin.json'))
          assert data.get('code') in {'TOKEN_MISSING','TOKEN_INVALID'}
          PY

      - name: Fake public-transit routing is rejected
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/transit.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"destinationId":"00000000-0000-0000-0000-000000000000","startLatitude":35.7595,"startLongitude":-5.8340,"travelMode":"transit","language":"en"}' \
            "$BASE_URL/api/ai/navigation-guidance")
          test "$status" = "501"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/transit.json'))
          assert data.get('code') == 'TRANSIT_NOT_SUPPORTED'
          PY
