name: Production Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://mymymymy-dusky.vercel.app
    steps:
      - name: Wait for hardened deployment marker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            status=$(curl -sS -o /tmp/traces.json -w '%{http_code}' "$BASE_URL/api/traces/summary" || true)
            if [ "$status" = "200" ] && python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/traces.json'))
              assert data.get('recent') == []
              assert isinstance(data.get('totalTraces'), int)
          except Exception:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo 'Hardened production deployment did not become ready in time' >&2
          exit 1

      - name: Homepage responds
        run: |
          test "$(curl -sS -o /tmp/home.html -w '%{http_code}' "$BASE_URL/")" = "200"
          grep -qi '<html' /tmp/home.html

      - name: Anonymous AI chat is blocked
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/ai.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"message":"hello","language":"en"}' \
            "$BASE_URL/api/ai/chat")
          test "$status" = "401"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/ai.json'))
          assert data.get('code') in {'TOKEN_MISSING','TOKEN_INVALID'} or 'Authentication' in data.get('error','')
          PY

      - name: Raw GPS details are not exposed
        run: |
          test "$(curl -sS -o /tmp/traces.json -w '%{http_code}' "$BASE_URL/api/traces/summary")" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/traces.json'))
          assert data.get('recent') == []
          assert isinstance(data.get('totalTraces'), int)
          text=json.dumps(data).lower()
          for forbidden in ('coordinates','anonymous_user_id','speed_kmh','near_place_id'):
              assert forbidden not in text
          PY

      - name: Fake public-transit routing is rejected
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/transit.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"destinationId":"00000000-0000-0000-0000-000000000000","startLatitude":35.7595,"startLongitude":-5.8340,"travelMode":"transit","language":"en"}' \
            "$BASE_URL/api/ai/navigation-guidance")
          test "$status" = "501"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/transit.json'))
          assert data.get('code') == 'TRANSIT_PROVIDER_UNAVAILABLE'
          PY
